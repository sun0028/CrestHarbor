{% extends 'jobs/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="max-w-2xl mx-auto py-12">
    <div class="bg-matte-card p-10 rounded-[3rem] shadow-2xl">
        <h2 class="text-3xl font-black mb-2 uppercase tracking-tighter">
            <span class="peach-white-text">Post a New Job</span>
        </h2>
        <p class="text-gray-500 font-bold text-xs uppercase tracking-widest mb-10 border-b border-white/5 pb-6">Create an opportunity for the global talent pool</p>
        
        <style>
            .job-form input, .job-form textarea, .job-form select { 
                background-color: #0f0f0f !important; 
                border: 1px solid #2a2a2a !important; 
                color: #fff5f0 !important; 
                border-radius: 15px !important;
                padding: 12px !important;
                font-family: 'Segoe UI', sans-serif !important;
            }
            .job-form label { color: #6b7280 !important; font-size: 10px !important; text-transform: uppercase !important; font-weight: 900 !important; letter-spacing: 0.1em !important; }
        </style>
        
        <form method="post" class="job-form space-y-6">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="pt-6">
                <button type="submit" class="btn-matte-search w-full text-white py-4 rounded-2xl font-black uppercase text-sm tracking-[0.2em]">
                    Publish Listing
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
